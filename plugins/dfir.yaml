# Host incident-response plugins - live-triage patterns distinct from the
# detection rules in blueteam.yaml.
---
id: dfir-reverse-shell
name: "Reverse Shell / Suspicious Child Process"
target_type: host
author: official
os_packages:
  arch: [lsof, procps-ng]
  debian: [lsof, procps]
  kali: [lsof, procps]
match:
  logic: any
  rules:
    - regex: 'bash -i|nc -e|/dev/tcp/|sh -i|python.*socket.*connect|mkfifo.*nc|socat.*exec'
tactics:
  phase: "Incident Response (Execution)"
  priority: 70
  next_step: "Identify the process and its parent, capture the socket, then contain before killing so you keep evidence."
  tools:
    - name: "network-backed procs"
      binary: "lsof"
      command: "lsof -i -nP | grep -E 'ESTABLISHED|LISTEN'"
      purpose: "Map processes to their network connections."
    - name: "process tree"
      binary: "ps"
      command: "ps -ef --forest"
      purpose: "Spot shells spawned by services/web processes."
---
id: dfir-suspicious-outbound
name: "Suspicious Outbound Connection"
target_type: host
author: official
os_packages:
  arch: [iproute2, lsof]
  debian: [iproute2, lsof]
  kali: [iproute2, lsof]
match:
  logic: any
  rules:
    - regex: 'ESTABLISHED.*:(4444|1337|9001|8443|6667)|curl .*\|.*sh|wget .*-O- .*\|.*sh|outbound'
tactics:
  phase: "Incident Response (C2 / Exfil)"
  priority: 62
  next_step: "Attribute the remote endpoint and owning process, then block egress and preserve the binary on disk."
  tools:
    - name: "connections"
      binary: "ss"
      command: "ss -tupn state established"
      purpose: "List established connections with owning PIDs."
---
id: dfir-new-account
name: "New / Modified User Account"
target_type: host
author: official
os_packages:
  arch: [shadow]
  debian: [passwd]
  kali: [passwd]
match:
  logic: any
  rules:
    - regex: 'new user|useradd|usermod|new group|UID 0|:0:0:|passwd changed|added to group (sudo|wheel|root)'
tactics:
  phase: "Incident Response (Persistence)"
  priority: 60
  next_step: "Review account/group changes for rogue UID-0 users or privileged-group additions, then lock and investigate."
  tools:
    - name: "uid-0 accounts"
      binary: "awk"
      command: "awk -F: '($3==0){print $1}' /etc/passwd ; getent group sudo wheel"
      purpose: "Find all root-equivalent accounts and admin-group members."
    - name: "account timeline"
      binary: "stat"
      command: "stat /etc/passwd /etc/shadow /etc/sudoers"
      purpose: "Check when auth files were last modified."
---
id: dfir-modified-binary
name: "Tampered System Binary / Rootkit"
target_type: host
author: official
os_packages:
  arch: [rkhunter]
  debian: [rkhunter, debsums]
  kali: [rkhunter]
match:
  logic: any
  rules:
    - regex: 'LD_PRELOAD|ld\.so\.preload|hidden process|rootkit|checksum mismatch|modified binary|/tmp/\.[a-z]'
tactics:
  phase: "Incident Response (Integrity)"
  priority: 65
  next_step: "Verify core binaries against the package database and check preload/kernel-module hiding."
  tools:
    - name: "verify packages"
      binary: "debsums"
      command: "debsums -c 2>/dev/null"
      purpose: "Find package files whose checksums changed (Debian/Kali)."
    - name: "arch integrity"
      binary: "pacman"
      command: "pacman -Qkk 2>/dev/null | grep -v '0 altered'"
      purpose: "Verify installed files against the package DB (Arch)."
    - name: "rkhunter"
      binary: "rkhunter"
      command: "rkhunter --check --sk"
      purpose: "Scan for known rootkit indicators."
---
id: dfir-bash-history
name: "Shell History IOCs"
target_type: host
author: official
os_packages:
  arch: [ripgrep]
  debian: [ripgrep]
  kali: [ripgrep]
match:
  logic: any
  rules:
    - regex: 'history -c|unset HISTFILE|export HISTSIZE=0|chattr|wget http|curl http.*sh|base64 -d'
tactics:
  phase: "Incident Response (Activity)"
  priority: 50
  next_step: "History-clearing is itself an IOC - recover shell history from all users and memory, and reconstruct actions."
  tools:
    - name: "all histories"
      binary: "find"
      command: "find /root /home -maxdepth 2 -name '.*_history' -exec ls -la {} \\;"
      purpose: "Locate every shell-history file on the host."
---
id: dfir-scheduled-task
name: "Malicious Scheduled Task"
target_type: host
author: official
os_packages:
  arch: [cronie]
  debian: [cron]
  kali: [cron]
match:
  logic: any
  rules:
    - regex: '@reboot|\* \* \* \* \*|crontab -|/etc/cron|at now|systemd-run|OnCalendar='
tactics:
  phase: "Incident Response (Persistence)"
  priority: 54
  next_step: "Enumerate all cron/at/systemd-timer entries for every user and flag anything fetching or decoding payloads."
  tools:
    - name: "all cron"
      binary: "bash"
      command: "for u in $(cut -f1 -d: /etc/passwd); do echo \"== $u\"; crontab -lu $u 2>/dev/null; done; cat /etc/cron*/* 2>/dev/null"
      purpose: "Dump every user and system cron entry."
