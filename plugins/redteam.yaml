  arch: []
  debian: []
  kali: [metasploit-framework]
match:
  logic: any
  rules:
    - regex: 'meterpreter|beacon|cobaltstrike|sliver|empire|/admin/get\.php|jquery-[0-9.]+\.min\.js'
