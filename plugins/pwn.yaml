# Binary exploitation / reverse engineering plugins.
# Triggered primarily by `file <binary>` output and gdb/checksec context.
---
id: pwn-elf64-exec-stack
name: ELF 64-bit Executable (Executable Stack / No NX)
target_type: binary
author: official
os_packages:
  arch: [checksec, gdb, radare2, python-pwntools]
  debian: [checksec, gdb, radare2, python3-pwntools]
  kali: [checksec, gdb, radare2, python3-pwntools]
match:
  logic: all
  rules:
    - regex: "ELF 64-bit"
    - regex: "executable stack|not stripped"
tactics:
  phase: "Binary Exploitation / Reverse Engineering"
  priority: 60
  next_step: "Confirm missing protections, then find the stack buffer-overflow offset with a cyclic pattern and build a shellcode payload."
  tools:
    - name: checksec
      binary: checksec
      command: "checksec --file={target}"
      purpose: "Enumerate binary protections (RELRO, Stack Canary, NX, PIE, Fortify)."
    - name: pwntools template
      binary: pwn
      command: "pwn template {target} > exploit.py"
      purpose: "Generate an exploit-script skeleton wired to the target binary."
    - name: radare2
      binary: r2
      command: "r2 -AA {target}"
      purpose: "Static analysis: functions, strings, and cross-references."
    - name: gdb + cyclic
      binary: gdb
      command: "gdb -q {target}"
      purpose: "Dynamic analysis; use `cyclic`/`pattern create` to locate the saved-RIP offset."
---
id: pwn-elf32
name: ELF 32-bit Executable
target_type: binary
author: official
os_packages:
  arch: [checksec, gdb, radare2, python-pwntools]
  debian: [checksec, gdb, radare2, python3-pwntools]
  kali: [checksec, gdb, radare2, python3-pwntools]
match:
  logic: all
  rules:
    - regex: "ELF 32-bit"
tactics:
  phase: "Binary Exploitation (x86)"
  priority: 40
  next_step: "Treat as 32-bit: arguments pass on the stack. Check protections and look for classic ret2libc / ret2win paths."
  tools:
    - name: checksec
      binary: checksec
      command: "checksec --file={target}"
      purpose: "Enumerate binary protections."
    - name: ropper
      binary: ropper
      command: "ropper --file {target} --search 'pop|ret'"
      purpose: "Find ROP gadgets for chain construction."
---
id: pwn-statically-linked
name: Statically-linked ELF
target_type: binary
author: official
os_packages:
  arch: [radare2, ropper, gdb]
  debian: [radare2, ropper, gdb]
  kali: [radare2, ropper, gdb]
match:
  logic: all
  rules:
    - regex: "ELF "
    - regex: "statically linked"
tactics:
  phase: "Binary Exploitation (static)"
  priority: 55
  next_step: "No libc to leak - hunt for ROP gadgets and syscall primitives directly inside the binary (ret2syscall)."
  tools:
    - name: ropper
      binary: ropper
      command: "ropper --file {target} --search 'syscall'"
      purpose: "Locate syscall gadgets for a ret2syscall chain."
    - name: ROPgadget
      binary: ROPgadget
      command: "ROPgadget --binary {target} --ropchain"
      purpose: "Auto-generate a ROP chain where possible."
---
id: pwn-windows-pe
name: Windows PE Executable
target_type: binary
author: official
os_packages:
  arch: [radare2, mono]
  debian: [radare2, mono-runtime]
  kali: [radare2, mono-runtime]
match:
  logic: any
  rules:
    - regex: "PE32\\+? executable"
    - contains: "for MS Windows"
tactics:
  phase: "Reverse Engineering (Windows)"
  priority: 45
  next_step: "Inspect imports/exports and sections; detonate in an isolated Windows VM for dynamic analysis."
  tools:
    - name: radare2
      binary: r2
      command: "r2 -AA {target}"
      purpose: "Static triage of PE imports, sections, and entry point."
---
id: pwn-core-dump
name: Core Dump Present
target_type: binary
author: official
os_packages:
  arch: [gdb]
  debian: [gdb]
  kali: [gdb]
match:
  logic: any
  rules:
    - regex: "ELF .*core file"
    - contains: "core file"
tactics:
  phase: "Crash Triage"
  priority: 50
  next_step: "Load the core dump to inspect the crash state, register values, and the faulting instruction."
  tools:
    - name: gdb core
      binary: gdb
      command: "gdb -q -c {target}"
      purpose: "Open the core dump; use `bt`, `info registers`, and `x/i $pc`."
