# Reverse engineering plugins — triggered by `file`, strings, and binary
# triage output across ELF / PE / Mach-O and managed runtimes.
---
id: rev-elf-triage
name: "ELF Binary (RE Triage)"
target_type: binary
author: official
os_packages:
  arch: [radare2, binutils, file]
  debian: [radare2, binutils, file]
  kali: [radare2, binutils, file]
match:
  logic: all
  rules:
    - regex: 'ELF (32|64)-bit'
tactics:
  phase: "Reverse Engineering (triage)"
  priority: 20
  next_step: "Start with strings and symbols, then load into a disassembler for control-flow analysis."
  tools:
    - name: "rabin2 info"
      binary: "rabin2"
      command: "rabin2 -I {target} ; rabin2 -z {target}"
      purpose: "Header metadata plus data-section strings."
    - name: "radare2"
      binary: "r2"
      command: "r2 -AA {target}"
      purpose: "Auto-analyze functions, xrefs, and strings."
    - name: "ghidra"
      binary: "ghidra"
      command: "ghidraRun"
      purpose: "Full decompilation in the Ghidra SRE suite."
      install: "pacman -S ghidra  # or apt install ghidra (kali)"
---
id: rev-upx-packed
name: "UPX-Packed Executable"
target_type: binary
author: official
os_packages:
  arch: [upx]
  debian: [upx-ucl]
  kali: [upx-ucl]
match:
  logic: any
  rules:
    - regex: 'UPX!|UPX0|UPX1|This file is packed with the UPX'
tactics:
  phase: "Reverse Engineering (unpacking)"
  priority: 55
  next_step: "Unpack before analysis — UPX is reversible with its own tool; manually dump if the header was tampered."
  tools:
    - name: "upx decompress"
      binary: "upx"
      command: "upx -d {target} -o {target}.unpacked"
      purpose: "Restore the original image from a UPX-packed binary."
---
id: rev-packed-high-entropy
name: "Packed / Obfuscated (High Entropy)"
target_type: binary
author: official
os_packages:
  arch: [radare2, binwalk]
  debian: [radare2, binwalk]
  kali: [radare2, binwalk]
match:
  logic: any
  rules:
    - regex: 'high entropy|packed|entropy: 7\.[89]|Themida|VMProtect|ASPack'
tactics:
  phase: "Reverse Engineering (unpacking)"
  priority: 45
  next_step: "High entropy suggests packing/encryption — dump from memory after the unpacking stub runs."
  tools:
    - name: "entropy scan"
      binary: "binwalk"
      command: "binwalk -E {target}"
      purpose: "Plot entropy to locate packed/compressed regions."
    - name: "radare2 dump"
      binary: "r2"
      command: "r2 -d {target}"
      purpose: "Debug to the original entry point and dump the unpacked image."
---
id: rev-dotnet
name: ".NET Managed Assembly"
target_type: binary
author: official
os_packages:
  arch: [mono]
  debian: [mono-runtime]
  kali: [mono-runtime]
match:
  logic: any
  rules:
    - regex: 'Mono/\.Net assembly|\.NET assembly|mscoree\.dll'
tactics:
  phase: "Reverse Engineering (.NET)"
  priority: 50
  next_step: ".NET decompiles cleanly to near-source — use a CIL decompiler rather than a native disassembler."
  tools:
    - name: "ilspycmd"
      binary: "ilspycmd"
      command: "ilspycmd {target} -o ./decompiled"
      purpose: "Decompile the assembly back to C#."
      install: "dotnet tool install -g ilspycmd"
    - name: "monodis"
      binary: "monodis"
      command: "monodis {target}"
      purpose: "Disassemble CIL with the Mono toolchain."
---
id: rev-go-binary
name: "Go Compiled Binary"
target_type: binary
author: official
os_packages:
  arch: [radare2]
  debian: [radare2]
  kali: [radare2]
match:
  logic: any
  rules:
    - regex: 'Go build ID|go1\.\d+|runtime\.main|\.gopclntab'
tactics:
  phase: "Reverse Engineering (Go)"
  priority: 40
  next_step: "Go strips conventionally but keeps a symbol table (gopclntab) — recover function names before analysis."
  tools:
    - name: "GoReSym"
      binary: "GoReSym"
      command: "GoReSym -p {target}"
      purpose: "Recover function and type metadata from a Go binary."
      install: "go install github.com/mandiant/GoReSym@latest"
    - name: "redress"
      binary: "redress"
      command: "redress -source {target}"
      purpose: "Reconstruct Go package/source structure."
      install: "go install github.com/goretk/redress@latest"
---
id: rev-pe-windows
name: "Windows PE Executable"
target_type: binary
author: official
os_packages:
  arch: [radare2, pev]
  debian: [radare2, pev]
  kali: [radare2, pev]
match:
  logic: any
  rules:
    - regex: 'PE32\+? executable'
    - contains: "for MS Windows"
tactics:
  phase: "Reverse Engineering (Windows)"
  priority: 42
  next_step: "Inspect imports, sections, and compile timestamp; detonate only in an isolated Windows VM."
  tools:
    - name: "peldd / pedump"
      binary: "readpe"
      command: "readpe -H {target} ; readpe -i {target}"
      purpose: "Dump PE headers and the import table."
    - name: "capa"
      binary: "capa"
      command: "capa {target}"
      purpose: "Identify capabilities via FLARE rules."
      install: "pipx install flare-capa"
---
id: rev-macho
name: "Mach-O (macOS) Binary"
target_type: binary
author: official
os_packages:
  arch: [radare2, binutils]
  debian: [radare2, binutils]
  kali: [radare2, binutils]
match:
  logic: any
  rules:
    - regex: 'Mach-O (64-bit|universal)'
tactics:
  phase: "Reverse Engineering (macOS)"
  priority: 40
  next_step: "Check code-signing and load commands; a universal (fat) binary carries multiple arch slices to split."
  tools:
    - name: "rabin2 mach"
      binary: "rabin2"
      command: "rabin2 -A {target} ; rabin2 -I {target}"
      purpose: "List architectures and header info."
---
id: rev-interesting-strings
name: "Interesting Strings / Secrets in Binary"
target_type: binary
author: official
os_packages:
  arch: [binutils, ripgrep]
  debian: [binutils, ripgrep]
  kali: [binutils, ripgrep]
match:
  logic: any
  rules:
    - regex: '-----BEGIN|AKIA[0-9A-Z]{16}|password=|api[_-]?key|BEGIN RSA PRIVATE'
tactics:
  phase: "Reverse Engineering (secrets)"
  priority: 35
  next_step: "Embedded credentials/keys are a shortcut — extract and triage all high-value strings."
  tools:
    - name: "strings + grep"
      binary: "strings"
      command: "strings -n 8 {target} | rg -i 'pass|key|token|secret|http'"
      purpose: "Surface credentials, URLs, and endpoints."
    - name: "flare-floss"
      binary: "floss"
      command: "floss {target}"
      purpose: "Recover obfuscated/stack strings FLOSS-style."
      install: "pipx install flare-floss"
---
id: rev-antidebug
name: "Anti-Debug / Anti-VM Indicators"
target_type: binary
author: official
os_packages:
  arch: [gdb, strace]
  debian: [gdb, strace]
  kali: [gdb, strace]
match:
  logic: any
  rules:
    - regex: 'ptrace|IsDebuggerPresent|rdtsc|cpuid|sandbox|VMware|VirtualBox'
tactics:
  phase: "Reverse Engineering (evasion)"
  priority: 38
  next_step: "Patch or hook the anti-analysis checks (ptrace/timing/CPUID) before stepping through."
  tools:
    - name: "ltrace ptrace"
      binary: "ltrace"
      command: "ltrace -e ptrace {target}"
      purpose: "Confirm ptrace self-attach anti-debug."
